  '@embedded-postgres/darwin-arm64@18.4.0-beta.17': true
  '@embedded-postgres/linux-x64@18.4.0-beta.17': true

strictDepBuilds: true
strictPeerDependencies: true

catalog:
  '@vitejs/plugin-react': 6.1.2
  ajv: 8.20.0
  fastify: 5.12.7
  pg: 8.23.1
  react: 19.3.1
  react-dom: 19.3.1
  typescript: 7.0.2
  vite: 8.3.5
  vitest: 4.1.12
  yaml: 2.9.1
