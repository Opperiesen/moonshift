packages:
  - apps/*
  - packages/*

allowBuilds:
  # Keep exact native-script approvals synchronized with embedded-postgres updates.
  '@embedded-postgres/darwin-arm64@18.4.0-beta.17': true
  '@embedded-postgres/linux-x64@18.4.0-beta.17': true

strictDepBuilds: true
strictPeerDependencies: true

catalog:
  '@vitejs/plugin-react': 6.1.1
  ajv: 8.20.0
  fastify: 5.12.5
  pg: 8.23.0
  react: 19.3.0
  react-dom: 19.3.0
  typescript: 7.0.2
  vite: 8.3.1
  vitest: 4.1.11
  yaml: 2.9.1
