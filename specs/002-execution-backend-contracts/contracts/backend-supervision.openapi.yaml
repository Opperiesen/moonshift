openapi: 3.1.0
info:
  title: Moonshift Backend Supervision API
  version: 0.2.0
  description: >-
    Additive loopback-only supervisor queries for deterministic backend qualification evidence. This
    initial US1 contract exposes no credential material and creates no real-provider support claim;
    later user stories extend it with routing and conformance-report queries.
servers:
  - url: http://127.0.0.1:{port}
    description: Existing owner-local Feature 001 control-plane server
    variables:
      port:
        default: "4310"
security:
  - LocalSupervisorSession: []
tags:
  - name: BackendSupervision
paths:
  /v1/backends:
    get:
      tags: [BackendSupervision]
      operationId: listBackendQualifications
      summary: List sanitized backend catalog and current qualification summaries
      responses:
        "200":
          description: Current deterministic catalog view
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [contractVersion, generatedAt, backends]
                properties:
                  contractVersion:
                    const: "2.0"
                  generatedAt:
                    type: string
                    format: date-time
                  backends:
                    type: array
                    maxItems: 1000
                    items:
                      $ref: "#/components/schemas/BackendQualificationSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/backends/{connectionId}/models/{modelDescriptorId}/qualification:
    get:
      tags: [BackendSupervision]
      operationId: getBackendQualification
      summary: Inspect exact connection-model qualification and evidence provenance
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
        - $ref: "#/components/parameters/ModelDescriptorId"
        - name: modelDescriptorVersion
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Qualification detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackendQualificationDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    LocalSupervisorSession:
      type: apiKey
      in: cookie
      name: moonshift_supervisor_session
      description: >-
        The same opaque host-only HttpOnly SameSite=Strict loopback supervisor session used by the
        Feature 001 API. It is never a backend credential and must not be exposed to JavaScript or
        logs.
  parameters:
    ConnectionId:
      name: connectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModelDescriptorId:
      name: modelDescriptorId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Missing or invalid owner-local supervisor session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The requested durable evidence is unavailable to the supervisor
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    BackendQualificationSummary:
      type: object
      additionalProperties: false
      required:
        - backendId
        - familyKind
        - testOnly
        - supportScope
        - realSupportClaim
        - familyProfileId
        - familyProfileVersion
        - adapterReleaseId
        - adapterVersion
        - connectionId
        - connectionName
        - configurationRevision
        - authenticationStatus
        - liveness
        - readiness
        - modelDescriptorId
        - modelDescriptorVersion
        - modelName
        - qualificationStatus
        - reasonCodes
        - validUntil
      properties:
        backendId:
          type: string
          format: uuid
        familyKind:
          enum: [MODEL_API, CODING_HARNESS, LOCAL_RUNTIME, DETERMINISTIC_FIXTURE]
        testOnly:
          const: true
        supportScope:
          const: TEST_FIXTURE_ONLY
        realSupportClaim:
          const: false
        familyProfileId:
          type: string
        familyProfileVersion:
          type: integer
          minimum: 1
        adapterReleaseId:
          type: string
          format: uuid
        adapterVersion:
          type: string
        connectionId:
          type: string
          format: uuid
        connectionName:
          type: string
        configurationRevision:
          type: integer
          minimum: 1
        authenticationStatus:
          enum: [AVAILABLE, UNAVAILABLE, EXPIRED, MISCONFIGURED, UNKNOWN]
        liveness:
          enum: [LIVE, UNREACHABLE, UNKNOWN]
        readiness:
          enum: [READY, DEGRADED, NOT_READY, UNKNOWN]
        modelDescriptorId:
          type: string
          format: uuid
        modelDescriptorVersion:
          type: integer
          minimum: 1
        modelName:
          type: string
        qualificationStatus:
          enum: [QUALIFIED, INELIGIBLE, STALE, UNKNOWN]
        reasonCodes:
          type: array
          uniqueItems: true
          items:
            type: string
        validUntil:
          type: string
          format: date-time
    BackendQualificationDetail:
      type: object
      additionalProperties: false
      required:
        - summary
        - qualificationId
        - qualificationHash
        - probeSnapshotId
        - healthSnapshotId
        - conformanceReportId
        - capabilityStatuses
        - derivationVersion
      properties:
        summary:
          $ref: "#/components/schemas/BackendQualificationSummary"
        qualificationId:
          type: string
          format: uuid
        qualificationHash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        probeSnapshotId:
          type: string
          format: uuid
        healthSnapshotId:
          type: string
          format: uuid
        conformanceReportId:
          type: string
          format: uuid
        capabilityStatuses:
          type: array
          maxItems: 256
          items:
            type: object
            additionalProperties: false
            required: [capabilityId, requirement, status, source]
            properties:
              capabilityId:
                type: string
              requirement:
                enum: [MANDATORY, OPTIONAL]
              status:
                enum:
                  - SUPPORTED
                  - UNSUPPORTED
                  - TEMPORARILY_UNAVAILABLE
                  - NOT_APPLICABLE
                  - UNKNOWN
              source:
                enum: [DECLARED, PROBED, CONFORMANCE]
        derivationVersion:
          type: string
    Problem:
      type: object
      additionalProperties: false
      required: [code, message, correlationId]
      properties:
        code:
          type: string
        message:
          type: string
        correlationId:
          type: string
          format: uuid
